<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" aria-labelledby="title desc" role="img" viewBox="0 0 960 280"><title id="title">Leo Lim — animated developer terminal</title><desc id="desc">An animated terminal introducing Leo Lim, OrderEase, and his engineering focus.</desc><defs><linearGradient id="panel" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#08111f"/><stop offset=".55" stop-color="#0b1728"/><stop offset="1" stop-color="#07101c"/></linearGradient><linearGradient id="border" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#38bdf8" stop-opacity=".25"/><stop offset=".5" stop-color="#22d3ee" stop-opacity=".9"/><stop offset="1" stop-color="#2563eb" stop-opacity=".3"/></linearGradient><linearGradient id="status" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#0ea5e9"/><stop offset="1" stop-color="#22d3ee"/></linearGradient><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path fill="none" stroke="#38bdf8" stroke-opacity=".045" stroke-width="1" d="M 28 0 L 0 0 0 28"/></pattern><filter id="glow" width="200%" height="200%" x="-50%" y="-50%"><feGaussianBlur result="blur" stdDeviation="3"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><clipPath id="command-one"><rect width="92" height="25" x="73" y="76"><animate attributeName="width" dur="10s" keyTimes="0;0.04;0.14;0.92;0.97;1" repeatCount="indefinite" values="0;0;92;92;92;0"/></rect></clipPath><clipPath id="answer-one"><rect width="500" height="27" x="73" y="101"><animate attributeName="width" dur="10s" keyTimes="0;0.14;0.32;0.92;1" repeatCount="indefinite" values="0;0;500;500;0"/></rect></clipPath><clipPath id="command-two"><rect width="184" height="25" x="73" y="133"><animate attributeName="width" dur="10s" keyTimes="0;0.33;0.46;0.92;1" repeatCount="indefinite" values="0;0;184;184;0"/></rect></clipPath><clipPath id="answer-two"><rect width="800" height="27" x="73" y="158"><animate attributeName="width" dur="10s" keyTimes="0;0.46;0.72;0.92;1" repeatCount="indefinite" values="0;0;800;800;0"/></rect></clipPath><clipPath id="command-three"><rect width="75" height="25" x="73" y="190"><animate attributeName="width" dur="10s" keyTimes="0;0.72;0.79;0.92;1" repeatCount="indefinite" values="0;0;75;75;0"/></rect></clipPath><clipPath id="answer-three"><rect width="700" height="25" x="73" y="215"><animate attributeName="width" dur="10s" keyTimes="0;0.79;0.91;0.96;1" repeatCount="indefinite" values="0;0;700;700;0"/></rect></clipPath><style>@keyframes blink{0%,45%{opacity:1}46%{opacity:0}}.mono{font-family:&quot;SFMono-Regular&quot;,Consolas,&quot;Liberation Mono&quot;,Menlo,monospace}.meta,.muted{font-size:11px}.meta{fill:#7dd3fc;font-weight:700;letter-spacing:1.8px}.muted{fill:#64748b}.prompt{fill:#22d3ee;font-weight:700}.answer,.command,.prompt{font-size:17px}.command{fill:#e2e8f0}.answer{fill:#94a3b8}.answer-strong{fill:#f8fafc;font-weight:700}.cursor{fill:#22d3ee;animation:blink .9s steps(1,end) infinite}@media (prefers-color-scheme:light){.command{fill:#e2e8f0}.answer{fill:#a8b5c7}.answer-strong{fill:#fff}}</style></defs><rect width="958" height="278" x="1" y="1" fill="url(#panel)" stroke="url(#border)" stroke-width="2" rx="22"/><rect width="956" height="276" x="2" y="2" fill="url(#grid)" rx="21"/><path stroke="#334155" stroke-opacity=".72" d="M22 55.5H938"/><circle cx="28" cy="28" r="5" fill="#fb7185"/><circle cx="46" cy="28" r="5" fill="#fbbf24"/><circle cx="64" cy="28" r="5" fill="#34d399"/><rect width="31" height="20" x="86" y="18" fill="#0ea5e9" fill-opacity=".15" stroke="#38bdf8" stroke-opacity=".35" rx="6"/><text x="101.5" y="32" class="mono meta" font-size="10" text-anchor="middle">LL</text><text x="128" y="32" class="mono meta">LEO LIM / GITHUB</text><text x="925" y="32" class="mono muted" text-anchor="end">SINGAPORE · UTC+8</text><text x="48" y="94" class="mono prompt">❯</text><g clip-path="url(#command-one)"><text x="73" y="94" class="mono command">whoami</text></g>